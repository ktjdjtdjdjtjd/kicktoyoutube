name: rethumb
# 投稿済み動画のサムネ再生成 (maintenance/rethumb.txt のuuidを処理)
on:
  workflow_dispatch:
  push:
    paths:
      - "maintenance/rethumb.txt"

permissions:
  contents: read

concurrency:
  group: rethumb
  cancel-in-progress: false

env:
  FONT_URL: "https://raw.githubusercontent.com/google/fonts/7da950f21232dc96d330070ae4cd5b98f02026d3/ofl/bizudpgothic/BIZUDPGothic-Regular.ttf"
  FONT_BLOB_SHA: "0753da0963c2fa25c5b5990d13f51842cb34e50d"
  EMOJI_FONT_URL: "https://raw.githubusercontent.com/googlefonts/noto-emoji/f3ae03f5e9b3b8516fa151f7168159ca1a3e7515/fonts/NotoColorEmoji.ttf"
  EMOJI_FONT_BLOB_SHA: "943741df1e37aa3ee3b5afc9129843fd8d81908c"

jobs:
  rethumb:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: |
          pip install --quiet curl_cffi==0.14.0 "yt-dlp[default,curl-cffi]==2026.7.4" \
            pillow==12.2.0 fonttools==4.60.1 \
            google-auth==2.53.0 google-auth-httplib2==0.3.1 google-api-python-client==2.194.0
      - name: Install ffmpeg (ubuntu-24.04ランナーは未搭載)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Fetch fonts (pinned, verified)
        run: |
          mkdir -p fonts
          curl -fsSL -o fonts/BIZUDPGothic-Regular.ttf "$FONT_URL"
          got=$(git hash-object fonts/BIZUDPGothic-Regular.ttf)
          if [ "$got" != "$FONT_BLOB_SHA" ]; then
            echo "font hash mismatch: $got"; exit 1
          fi
          curl -fsSL -o fonts/NotoColorEmoji.ttf "$EMOJI_FONT_URL"
          got=$(git hash-object fonts/NotoColorEmoji.ttf)
          if [ "$got" != "$EMOJI_FONT_BLOB_SHA" ]; then
            echo "emoji font hash mismatch: $got"; exit 1
          fi
      - name: Regenerate thumbnails
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          YT_TOKEN_JSON_NINIMARU: ${{ secrets.YT_TOKEN_JSON_NINIMARU }}
          YT_TOKEN_JSON_WAINAINA: ${{ secrets.YT_TOKEN_JSON_WAINAINA }}
        run: |
          PYTHONPATH=scripts python scripts/rethumb.py
