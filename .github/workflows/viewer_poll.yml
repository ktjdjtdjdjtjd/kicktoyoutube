name: viewer_poll
# 配信中の視聴者数を記録する（Top10採点用）。Actionsのcron最短は5分のため、1ジョブ内で約1分おきに4回取る。
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write   # state/viewers/ への追記コミット

concurrency:
  group: viewer-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install --quiet curl_cffi==0.14.0
      - name: Poll viewers
        run: PYTHONPATH=scripts python scripts/viewer_poll.py --slug zingisukan2525 --samples 4 --interval 60 --dir state/viewers
      - name: Commit samples
        run: |
          git add state/viewers || true
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "viewers: sample"
          git push
