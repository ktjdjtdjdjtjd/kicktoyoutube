name: viewer_poll
# 配信中の視聴者数を記録する（Top10採点用）。Kick公式Public API（アプリトークン）を使用。
# cronは最短5分で遅延・スキップがあるため、1ジョブ内で約60秒おきに約290秒サンプリングし、
# 実UTC時刻を保存。重複は分単位で除去、180秒超の欠損は「gap」として記録（補間しない）。
# 公開リポジトリの標準ランナーなので $0。
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write   # state/viewers/ への追記コミット

concurrency:
  group: viewer-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Guard (secrets missing -> skip cleanly)
        id: guard
        env:
          CID: ${{ secrets.KICK_CLIENT_ID }}
          CSEC: ${{ secrets.KICK_CLIENT_SECRET }}
        run: |
          if [ -z "$CID" ] || [ -z "$CSEC" ]; then echo "KICK_CLIENT_ID/SECRET not set; skip"; echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        if: steps.guard.outputs.ok == 'true'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        if: steps.guard.outputs.ok == 'true'
        with:
          python-version: "3.12"
      - name: Poll viewers (official API)
        if: steps.guard.outputs.ok == 'true'
        env:
          KICK_CLIENT_ID: ${{ secrets.KICK_CLIENT_ID }}
          KICK_CLIENT_SECRET: ${{ secrets.KICK_CLIENT_SECRET }}
        run: python scripts/viewer_poll.py --slug zingisukan2525 --interval 60 --duration 290 --dir state/viewers
      - name: Commit samples (append-only per-run file; rebase-safe)
        if: steps.guard.outputs.ok == 'true'
        run: |
          git add state/viewers || true
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "viewers: sample ${GITHUB_RUN_ID}"
          # 各runは別ファイルなので rebase で衝突しない
          git pull --rebase -q origin "${GITHUB_REF_NAME}"
          git push -q origin "HEAD:${GITHUB_REF_NAME}"
