name: watch
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install --quiet curl_cffi==0.14.0
      - name: Watch channels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd $GITHUB_WORKSPACE
          PYTHONPATH=scripts python scripts/watch.py
