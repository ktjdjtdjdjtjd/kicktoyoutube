name: burnonly
# コメ焼きオンリー: Kick/TwitchのVODにダンマクを焼き、YouTubeへは上げず
# 成果物(artifact)として返す。ローカルの cloudburn.py が依頼(queue_burn/request.json の
# push)と回収(artifact DL)を担う
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "kick | twitch"
        required: true
        default: "kick"
      video:
        description: "VOD URL (kick.com/<slug>/videos/<uuid> / twitch.tv/videos/<id>)"
        required: true
      limit_seconds:
        description: "smoke test: 先頭N秒のみ (0=全編)"
        required: false
        default: "0"
  push:
    paths:
      - "queue_burn/request.json"

permissions:
  contents: read

env:
  FONT_URL: "https://raw.githubusercontent.com/google/fonts/7da950f21232dc96d330070ae4cd5b98f02026d3/ofl/bizudpgothic/BIZUDPGothic-Regular.ttf"
  FONT_BLOB_SHA: "0753da0963c2fa25c5b5990d13f51842cb34e50d"
  EMOJI_FONT_URL: "https://raw.githubusercontent.com/googlefonts/noto-emoji/f3ae03f5e9b3b8516fa151f7168159ca1a3e7515/fonts/NotoColorEmoji.ttf"
  EMOJI_FONT_BLOB_SHA: "943741df1e37aa3ee3b5afc9129843fd8d81908c"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      slug: ${{ steps.plan.outputs.slug }}
      uuid: ${{ steps.plan.outputs.uuid }}
      name: ${{ steps.plan.outputs.name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install --quiet curl_cffi==0.14.0 "yt-dlp[default,curl-cffi]==2026.7.4" pillow==12.2.0
      - name: Resolve request + download chat
        id: plan
        run: |
          if [ -n "${{ inputs.video }}" ]; then
            PYTHONPATH=scripts python scripts/burn_request.py \
              --platform "${{ inputs.platform }}" \
              --video "${{ inputs.video }}" \
              --limit-seconds "${{ inputs.limit_seconds || '0' }}"
          else
            PYTHONPATH=scripts python scripts/burn_request.py
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: chatpack
          path: out/
          retention-days: 3

  burn:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: true
      max-parallel: 4
      matrix:
        seg: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install --quiet curl_cffi==0.14.0 "yt-dlp[default,curl-cffi]==2026.7.4" pillow==12.2.0 fonttools==4.60.1
      - name: Install ffmpeg (ubuntu-24.04ランナーは未搭載)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Fetch fonts (pinned, verified)
        run: |
          mkdir -p fonts
          curl -fsSL -o fonts/BIZUDPGothic-Regular.ttf "$FONT_URL"
          got=$(git hash-object fonts/BIZUDPGothic-Regular.ttf)
          if [ "$got" != "$FONT_BLOB_SHA" ]; then
            echo "font hash mismatch: $got"; exit 1
          fi
          curl -fsSL -o fonts/NotoColorEmoji.ttf "$EMOJI_FONT_URL"
          got=$(git hash-object fonts/NotoColorEmoji.ttf)
          if [ "$got" != "$EMOJI_FONT_BLOB_SHA" ]; then
            echo "emoji font hash mismatch: $got"; exit 1
          fi
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL 2>/dev/null || true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: chatpack
          path: out
      - name: Download VOD + burn segment
        run: |
          seg_name=$(printf 'seg_%03d.mp4' "${{ matrix.seg.idx }}")
          PYTHONPATH=scripts python scripts/burn.py \
            "${{ needs.plan.outputs.slug }}" "${{ needs.plan.outputs.uuid }}" \
            "${{ matrix.seg.start }}" "${{ matrix.seg.end }}" \
            --chat out/chat.jsonl --emotes out/emotes --meta out/meta.json \
            --font fonts/BIZUDPGothic-Regular.ttf --out "$seg_name"
          rm -f vod.mp4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: seg-${{ matrix.seg.idx }}
          path: seg_*.mp4
          retention-days: 1

  assemble:
    needs: [plan, burn]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Install ffmpeg (ubuntu-24.04ランナーは未搭載)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL 2>/dev/null || true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: chatpack
          path: out
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          pattern: seg-*
          path: segs
      - name: Concat + verify + rename
        run: |
          python scripts/assemble.py --meta out/meta.json --segdir segs --out final.mp4
          mv final.mp4 "${{ needs.plan.outputs.name }}_with_chat.mp4"
          ls -lh *_with_chat.mp4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: final-${{ needs.plan.outputs.uuid }}
          path: "*_with_chat.mp4"
          retention-days: 3
