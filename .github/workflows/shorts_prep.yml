name: shorts_prep
# ショート下書き素材の一括生成: 採用区間の部分DL+whisper字幕+タイトル案 → artifact返却
on:
  workflow_dispatch:
  push:
    paths:
      - "queue_shorts/request.json"

permissions:
  contents: read

env:
  FONT_URL: "https://raw.githubusercontent.com/google/fonts/7da950f21232dc96d330070ae4cd5b98f02026d3/ofl/bizudpgothic/BIZUDPGothic-Regular.ttf"
  FONT_BLOB_SHA: "0753da0963c2fa25c5b5990d13f51842cb34e50d"

concurrency:
  group: shorts-prep
  cancel-in-progress: false

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: |
          pip install --quiet curl_cffi==0.14.0 "yt-dlp[default,curl-cffi]==2026.7.4" \
            faster-whisper==1.2.1 pillow==12.2.0
      - name: Install ffmpeg (ubuntu-24.04ランナーは未搭載)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Fetch font (pinned, verified)
        run: |
          mkdir -p fonts
          curl -fsSL -o fonts/BIZUDPGothic-Regular.ttf "$FONT_URL"
          got=$(git hash-object fonts/BIZUDPGothic-Regular.ttf)
          if [ "$got" != "$FONT_BLOB_SHA" ]; then
            echo "font hash mismatch: $got"; exit 1
          fi
      - name: Prep clips
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: PYTHONPATH=scripts python scripts/shorts_prep.py
      # 朝ボードで「見た目の完成形」を見て採否を決めるための下書き。本番はCapCutで作る
      - name: Render vertical drafts
        run: PYTHONPATH=scripts python scripts/shorts_render.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: shortpack
          path: |
            out_shorts/
            !out_shorts/fonts/
          retention-days: 3
