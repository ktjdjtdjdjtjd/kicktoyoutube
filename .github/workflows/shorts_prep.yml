name: shorts_prep
# ショート下書き素材の一括生成: 採用区間の部分DL+whisper字幕+タイトル案 → artifact返却
on:
  # URL を渡すだけで 候補選定→素材化→縦型下書き まで通す(区間は自動で選ばれる)
  workflow_dispatch:
    inputs:
      video:
        description: "Source URL (kick / twitch; TikTok modes use a published Omoshiro Movies YouTube URL)"
        required: true
      platform:
        description: "kick | twitch | youtube (空ならURLから判定。TikTok modesではyoutube固定)"
        required: false
        default: ""
      n:
        description: "作る本数"
        required: false
        default: "8"
      tiktok_preview:
        description: "投稿せず、@tateyamaclips用のモザイク済み動画を確認"
        required: false
        type: boolean
        default: false
      tiktok_test_post:
        description: "@tateyamaclipsへテスト投稿を1本予約（公開範囲はTikTok側の設定に従う）"
        required: false
        type: boolean
        default: false
      tiktok_auto_post:
        description: "通常の自動投稿（TIKTOK_AUTOPUBLISH_ENABLED=true と tiktok-autopost reviewer承認が必要）"
        required: false
        type: boolean
        default: false
  # 手で区間を決めた依頼はこれまで通り request.json を push する
  push:
    paths:
      - "queue_shorts/request.json"

permissions:
  contents: read

env:
  FONT_URL: "https://raw.githubusercontent.com/google/fonts/7da950f21232dc96d330070ae4cd5b98f02026d3/ofl/bizudpgothic/BIZUDPGothic-Regular.ttf"
  FONT_BLOB_SHA: "0753da0963c2fa25c5b5990d13f51842cb34e50d"

concurrency:
  group: shorts-prep
  cancel-in-progress: false

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      kick_video_url: ${{ steps.source.outputs.kick_video_url }}
    steps:
      - name: Reject overlapping TikTok modes
        if: (inputs.tiktok_preview == true && (inputs.tiktok_test_post == true || inputs.tiktok_auto_post == true)) || (inputs.tiktok_test_post == true && inputs.tiktok_auto_post == true)
        run: |
          echo "::error::Choose only one of tiktok_preview, tiktok_test_post, and tiktok_auto_post."
          exit 1
      - name: Require one-time TikTok test-post switch
        if: inputs.tiktok_test_post == true && inputs.tiktok_preview != true && vars.TIKTOK_TEST_POST_ENABLED != 'true'
        run: |
          echo "::error::Set TIKTOK_TEST_POST_ENABLED=true only after the preview and cost checks."
          exit 1
      - name: Require explicit normal TikTok autopost switch
        if: inputs.tiktok_auto_post == true && vars.TIKTOK_AUTOPUBLISH_ENABLED != 'true'
        run: |
          echo "::error::Set TIKTOK_AUTOPUBLISH_ENABLED=true only after the single test post and reviewer-gate setup."
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: |
          pip install --quiet curl_cffi==0.14.0 "yt-dlp[default,curl-cffi]==2026.7.4" \
            faster-whisper==1.2.1 pillow==12.2.0
      - name: Install ffmpeg (ubuntu-24.04ランナーは未搭載)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Fetch font (pinned, verified)
        run: |
          mkdir -p fonts
          curl -fsSL -o fonts/BIZUDPGothic-Regular.ttf "$FONT_URL"
          got=$(git hash-object fonts/BIZUDPGothic-Regular.ttf)
          if [ "$got" != "$FONT_BLOB_SHA" ]; then
            echo "font hash mismatch: $got"; exit 1
          fi
      # 入力は env 経由で渡す(run に直接展開するとURL文字列がシェルに解釈される)
      - name: Build request from inputs
        if: github.event_name == 'workflow_dispatch'
        env:
          IN_VIDEO: ${{ inputs.video }}
          IN_PLATFORM: ${{ (inputs.tiktok_preview == true || inputs.tiktok_test_post == true || inputs.tiktok_auto_post == true) && 'youtube' || inputs.platform }}
          IN_N: ${{ (inputs.tiktok_preview == true || inputs.tiktok_test_post == true || inputs.tiktok_auto_post == true) && '1' || inputs.n }}
        run: |
          python scripts/shorts_request.py \
            --video "$IN_VIDEO" --platform "$IN_PLATFORM" --n "$IN_N"
      - name: Validate published YouTube source
        id: source
        env:
          SOURCE_CHANNEL_ID: ${{ vars.TIKTOK_SOURCE_CHANNEL_ID }}
          TIKTOK_MODE: ${{ inputs.tiktok_preview == true || inputs.tiktok_test_post == true || inputs.tiktok_auto_post == true }}
        run: |
          SOURCE_URL=$(python -c 'import json; print(json.load(open("queue_shorts/request.json", encoding="utf-8")).get("video", ""))')
          SOURCE_PLATFORM=$(python -c 'import json; print(json.load(open("queue_shorts/request.json", encoding="utf-8")).get("platform", ""))')
          if [ "$TIKTOK_MODE" = "true" ] && [ "$SOURCE_PLATFORM" != "youtube" ]; then
            echo "::error::TikTok preview/test requires a published YouTube source."
            exit 1
          fi
          if [ "$SOURCE_PLATFORM" = "youtube" ]; then
            if [ -z "$SOURCE_CHANNEL_ID" ]; then
              echo "::error::Set the TIKTOK_SOURCE_CHANNEL_ID repository variable to the exact Omoshiro Movies channel ID."
              exit 1
            fi
            python scripts/shorts_youtube_source.py \
              --url "$SOURCE_URL" \
              --expected-channel-id "$SOURCE_CHANNEL_ID" \
              --state-dir state \
              --out-json queue_shorts/youtube_source.json
            if [ "$TIKTOK_MODE" = "true" ]; then
              python - <<'PY'
          import json
          import sys
          from urllib.parse import urlsplit
          source = json.load(open("queue_shorts/youtube_source.json", encoding="utf-8"))
          kick_url = urlsplit(str(source.get("kick_video_url") or ""))
          if (kick_url.scheme != "https" or kick_url.netloc != "kick.com"
                  or not kick_url.path.startswith("/zingisukan2525/videos/")):
              print("::error::TikTok preview/test/auto is limited to Zingisukan Kick VODs.")
              sys.exit(1)
          PY
            fi
          fi
      # segments 未指定の依頼は、チャットの盛り上がりから区間を自動で選ぶ。
      # 選定ロジックは手元の候補ボードからの移植(実データ20件で結果一致を確認済み)
      - name: Pick candidates (segments 未指定のときだけ)
        run: |
          if [ "${{ inputs.tiktok_preview == true || inputs.tiktok_test_post == true || inputs.tiktok_auto_post == true }}" = "true" ]; then
            PYTHONPATH=scripts python scripts/shorts_pick.py --max-sec 90 --min-sec 45
          else
            PYTHONPATH=scripts python scripts/shorts_pick.py
          fi
      # Independent of vertical draft rendering. Existing candidates/decisions are never replaced.
      - name: Append padded previews to private selection board
        id: board
        continue-on-error: true
        if: vars.BOARD_ENABLED == 'true' && inputs.tiktok_preview != true && inputs.tiktok_test_post != true && inputs.tiktok_auto_post != true
        env:
          BOARD_URL: ${{ vars.BOARD_URL }}
          BOARD_INGEST_TOKEN: ${{ secrets.BOARD_INGEST_TOKEN }}
        run: PYTHONPATH=scripts python scripts/board_publish.py
      - name: Prep clips
        env:
          GEMINI_API_KEY: ${{ inputs.tiktok_preview != true && inputs.tiktok_test_post != true && inputs.tiktok_auto_post != true && secrets.GEMINI_API_KEY || '' }}
          TIKTOK_AUTOPUBLISH: ${{ inputs.tiktok_preview || inputs.tiktok_test_post || inputs.tiktok_auto_post }}
        run: PYTHONPATH=scripts python scripts/shorts_prep.py
      # 朝ボードで「見た目の完成形」を見て採否を決めるための下書き。本番はCapCutで作る
      - name: Render vertical drafts
        run: PYTHONPATH=scripts python scripts/shorts_render.py
      - name: Mosaic everyone except the presumed streamer
        if: inputs.tiktok_preview == true || inputs.tiktok_test_post == true || inputs.tiktok_auto_post == true
        run: |
          pip install --quiet opencv-python-headless==4.10.0.84
          mkdir -p models
          curl -fL --retry 3 --retry-delay 2 \
            -o models/object_detection_yolox_2022nov.onnx \
            'https://huggingface.co/opencv/opencv_zoo/resolve/main/models/object_detection_yolox/object_detection_yolox_2022nov.onnx?download=true'
          echo 'c5c2d13e59ae883e6af3b45daea64af4833a4951c92d116ec270d9ddbe998063  models/object_detection_yolox_2022nov.onnx' \
            | sha256sum --check
          PYTHONPATH=scripts python scripts/shorts_mosaic.py \
            out_shorts/short_01.mp4 out_shorts/tiktok_final.mp4 \
            --model models/object_detection_yolox_2022nov.onnx
      - name: Verify mosaiced TikTok video
        if: inputs.tiktok_preview == true || inputs.tiktok_test_post == true || inputs.tiktok_auto_post == true
        run: python scripts/shorts_verify.py out_shorts/tiktok_final.mp4
      - name: Save TikTok preview or test-post artifact
        if: inputs.tiktok_preview == true || inputs.tiktok_test_post == true || inputs.tiktok_auto_post == true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: shortpack
          path: |
            out_shorts/tiktok_final.mp4
            out_shorts/manifest.json
          retention-days: 1
      - name: Save regular shortpack artifact
        if: inputs.tiktok_preview != true && inputs.tiktok_test_post != true && inputs.tiktok_auto_post != true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: shortpack
          path: |
            out_shorts/
            !out_shorts/fonts/
          retention-days: 3
      - name: Report board upload failure after preserving the original shortpack
        if: always() && steps.board.outcome == 'failure' && inputs.tiktok_preview != true && inputs.tiktok_test_post != true && inputs.tiktok_auto_post != true
        run: |
          echo 'Candidate board upload failed. Existing candidates are safe; rerun to retry.'
          exit 1

  tiktok_test_post:
    if: ${{ inputs.tiktok_test_post == true && inputs.tiktok_preview != true }}
    needs: [prep]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: tiktok-test-post
    concurrency:
      group: tiktok-test-post
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Verify test-post environment requires a reviewer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/shorts_tiktok_environment.py --environment tiktok-test-post
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: shortpack
          path: out_shorts
      - name: Install R2 client
        run: pip install --quiet boto3==1.43.100
      - name: Schedule one TikTok test post
        env:
          POST_FILE: out_shorts/tiktok_final.mp4
          VOD_VIDEO: ${{ needs.prep.outputs.kick_video_url }}
          TIKTOK_TEST_POST: 'true'
          TIKTOK_TEST_POST_ENABLED: ${{ vars.TIKTOK_TEST_POST_ENABLED }}
          TIKTOK_AUTOPUBLISH_ENABLED: ${{ vars.TIKTOK_AUTOPUBLISH_ENABLED }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_TIKTOK_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_CHANNEL_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TIKTOK_OBJECT_KEY_SECRET: ${{ secrets.TIKTOK_OBJECT_KEY_SECRET }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
        run: PYTHONPATH=scripts python scripts/shorts_tiktok_post.py

  tiktok_auto_post:
    if: ${{ inputs.tiktok_auto_post == true && inputs.tiktok_preview != true && inputs.tiktok_test_post != true }}
    needs: [prep]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: tiktok-autopost
    concurrency:
      group: tiktok-autopost
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Verify autopost environment requires a reviewer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/shorts_tiktok_environment.py --environment tiktok-autopost
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: shortpack
          path: out_shorts
      - name: Install R2 client
        run: pip install --quiet boto3==1.43.100
      - name: Schedule TikTok post
        env:
          POST_FILE: out_shorts/tiktok_final.mp4
          VOD_VIDEO: ${{ needs.prep.outputs.kick_video_url }}
          TIKTOK_TEST_POST: 'false'
          TIKTOK_AUTOPUBLISH_ENABLED: ${{ vars.TIKTOK_AUTOPUBLISH_ENABLED }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_TIKTOK_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_CHANNEL_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TIKTOK_OBJECT_KEY_SECRET: ${{ secrets.TIKTOK_OBJECT_KEY_SECRET }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
        run: PYTHONPATH=scripts python scripts/shorts_tiktok_post.py
