name: recover-chapters-once
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recovery-5035af28-d0bf-4308-a59c-e169618d8e1e
  cancel-in-progress: false
env:
  HF_HUB_DISABLE_TELEMETRY: "1"
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Validate approved target and create bounded plan
        id: plan
        run: |
          python - <<'PY'
          import json, os, pathlib
          uid = '5035af28-d0bf-4308-a59c-e169618d8e1e'
          st = json.loads(pathlib.Path(f'state/{uid}.json').read_text())
          ledger = json.loads(pathlib.Path(f'.recovery/{uid}.json').read_text())
          assert st['uuid'] == uid and st['status'] == 'done'
          assert st['yt_url'] == 'https://www.youtube.com/watch?v=kTmq4pE5mfo'
          assert not st.get('parts')
          assert st['chapters']['result'] == 'retryable-transcription-failed'
          assert ledger['generation_attempts'] == 0 and float(ledger['approved_budget_usd']) == 10
          total = float(st['duration_s'])
          assert 0 < total <= 33716
          segs = [{'idx': i, 'start': i * 2700, 'end': min((i + 1) * 2700, total)}
                  for i in range(int((total + 2699) // 2700))]
          assert len(segs) == 13
          pathlib.Path('out').mkdir()
          pathlib.Path('out/chapters_plan.json').write_text(json.dumps({
              'uuid': uid, 'slug': st['slug'], 'yt_url': st['yt_url'],
              'n_segments': 13, 'duration_s': total}), encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('matrix=' + json.dumps(segs) + '\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recovery-plan
          path: out/chapters_plan.json
          retention-days: 1
  transcribe:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        seg: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pinned decoder dependencies and preflight
        run: |
          pip install --quiet curl_cffi==0.14.0 "yt-dlp[default,curl-cffi]==2026.7.4" faster-whisper==1.2.1 av==15.1.0
          python -m pip check
          PYTHONPATH=scripts python scripts/transcription_preflight.py
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Transcribe only the approved VOD window
        run: |
          PYTHONPATH=scripts python scripts/chapters.py --mode transcribe \
            --slug zingisukan2525 --uuid 5035af28-d0bf-4308-a59c-e169618d8e1e \
            --idx "${{ matrix.seg.idx }}" --start "${{ matrix.seg.start }}" --end "${{ matrix.seg.end }}"
          python - <<'PY'
          import pathlib
          files = list(pathlib.Path('segs').glob('seg_*.json'))
          assert len(files) == 1 and files[0].stat().st_size <= 102400
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recovery-seg-${{ matrix.seg.idx }}
          path: segs/seg_*.json
          retention-days: 1
  finalize:
    needs: [plan, transcribe]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install existing YouTube client dependencies
        run: pip install --quiet curl_cffi==0.14.0 google-auth==2.53.0 google-auth-httplib2==0.3.1 google-api-python-client==2.194.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: recovery-plan
          path: out
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: recovery-seg-*
          path: segs
          merge-multiple: true
      - name: Prepare, generate once within budget, and update only the approved description
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_TOKEN_JSON_WAINAINA: ${{ secrets.YT_TOKEN_JSON_WAINAINA }}
        run: |
          PYTHONPATH=scripts python scripts/recover_chapters_once.py --mode prepare
          PYTHONPATH=scripts python scripts/recover_chapters_once.py --mode generate
          PYTHONPATH=scripts python scripts/recover_chapters_once.py --mode publish
      - name: Bound recovery artifact size
        id: artifact_size
        if: always()
        run: |
          python - <<'PY'
          import pathlib
          assert sum(p.stat().st_size for p in pathlib.Path('out').rglob('*') if p.is_file()) <= 2097152
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.artifact_size.outcome == 'success'
        with:
          name: recovery-receipt
          path: out/
          retention-days: 1
