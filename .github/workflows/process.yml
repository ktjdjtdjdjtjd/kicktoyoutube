name: process
on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Kick channel slug"
        required: true
      uuid:
        description: "VOD uuid (kick.com/<slug>/videos/<uuid>)"
        required: true
      privacy:
        description: "YouTube privacy (empty = config.json)"
        required: false
        default: ""
      limit_windows:
        description: "smoke test: limit chat windows (0 = full)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: process-${{ inputs.uuid }}
  cancel-in-progress: false

env:
  FONT_URL: "https://raw.githubusercontent.com/google/fonts/7da950f21232dc96d330070ae4cd5b98f02026d3/ofl/bizudpgothic/BIZUDPGothic-Regular.ttf"
  FONT_BLOB_SHA: "0753da0963c2fa25c5b5990d13f51842cb34e50d"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      title: ${{ steps.plan.outputs.title }}
      date: ${{ steps.plan.outputs.date }}
      duration_s: ${{ steps.plan.outputs.duration_s }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet "curl_cffi>=0.7"
      - name: Resolve meta + download chat + build ASS
        id: plan
        run: |
          PYTHONPATH=scripts python scripts/plan.py \
            "${{ inputs.slug }}" "${{ inputs.uuid }}" \
            --out out --limit-windows "${{ inputs.limit_windows }}"
      - uses: actions/upload-artifact@v4
        with:
          name: chatpack
          path: out/
          retention-days: 3

  burn:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: true
      max-parallel: 2
      matrix:
        seg: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet "curl_cffi>=0.7" "yt-dlp[default,curl-cffi]"
      - name: Fetch danmaku font (pinned, verified)
        run: |
          mkdir -p fonts
          curl -fsSL -o fonts/BIZUDPGothic-Regular.ttf "$FONT_URL"
          got=$(git hash-object fonts/BIZUDPGothic-Regular.ttf)
          if [ "$got" != "$FONT_BLOB_SHA" ]; then
            echo "font hash mismatch: $got"; exit 1
          fi
      - name: Free disk space (8時間級VODのDL+エンコードに備える)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL 2>/dev/null || true
      - uses: actions/download-artifact@v4
        with:
          name: chatpack
          path: out
      - name: Download VOD + burn segment
        run: |
          seg_name=$(printf 'seg_%03d.mp4' "${{ matrix.seg.idx }}")
          PYTHONPATH=scripts python scripts/burn.py \
            "${{ inputs.slug }}" "${{ inputs.uuid }}" \
            "${{ matrix.seg.start }}" "${{ matrix.seg.end }}" \
            --ass out/full.ass --meta out/meta.json --out "$seg_name" --fontsdir fonts
          rm -f vod.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: seg-${{ matrix.seg.idx }}
          path: seg_*.mp4
          retention-days: 1

  assemble:
    needs: [plan, burn]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet google-auth google-auth-httplib2 google-api-python-client
      - name: Free disk space (セグメント合計+結合後で2倍の容量が要る)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL 2>/dev/null || true
      - uses: actions/download-artifact@v4
        with:
          name: chatpack
          path: out
      - uses: actions/download-artifact@v4
        with:
          pattern: seg-*
          path: segs
      - name: Concat + verify
        run: PYTHONPATH=scripts python scripts/assemble.py --meta out/meta.json --segdir segs --out final.mp4
      - name: Upload to YouTube
        id: upload
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: |
          PYTHONPATH=scripts python scripts/yt_upload.py final.mp4 \
            --meta out/meta.json --privacy "${{ inputs.privacy }}"
      - name: Mark done
        run: |
          PYTHONPATH=scripts python scripts/mark_done.py "${{ inputs.uuid }}" \
            --status done --yt-url "${{ steps.upload.outputs.yt_url }}"
      - name: Notify (Discord, optional)
        if: always()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TITLE: ${{ needs.plan.outputs.title }}
          YT_URL: ${{ steps.upload.outputs.yt_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VOD: ${{ inputs.slug }}/${{ inputs.uuid }}
          JOB_STATUS: ${{ job.status }}
        run: |
          [ -z "$WEBHOOK" ] && exit 0
          if [ "$JOB_STATUS" = "success" ]; then
            export MSG="kick-archive OK: $TITLE -> $YT_URL"
          else
            export MSG="kick-archive FAILED: $VOD ($RUN_URL)"
          fi
          curl -fsS -H "Content-Type: application/json" \
            -d "$(python -c 'import json,os;print(json.dumps({"content":os.environ["MSG"]}))')" \
            "$WEBHOOK" || true
