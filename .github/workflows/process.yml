name: process
on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Kick channel slug"
        required: true
      uuid:
        description: "VOD uuid (kick.com/<slug>/videos/<uuid>)"
        required: true
      privacy:
        description: "YouTube privacy (empty = config.json)"
        required: false
        default: ""
      limit_windows:
        description: "smoke test: limit chat windows (0 = full)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: process-${{ inputs.uuid }}
  cancel-in-progress: false

env:
  FONT_URL: "https://raw.githubusercontent.com/google/fonts/7da950f21232dc96d330070ae4cd5b98f02026d3/ofl/bizudpgothic/BIZUDPGothic-Regular.ttf"
  FONT_BLOB_SHA: "0753da0963c2fa25c5b5990d13f51842cb34e50d"
  EMOJI_FONT_URL: "https://raw.githubusercontent.com/googlefonts/noto-emoji/f3ae03f5e9b3b8516fa151f7168159ca1a3e7515/fonts/NotoColorEmoji.ttf"
  EMOJI_FONT_BLOB_SHA: "943741df1e37aa3ee3b5afc9129843fd8d81908c"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      title: ${{ steps.plan.outputs.title }}
      date: ${{ steps.plan.outputs.date }}
      duration_s: ${{ steps.plan.outputs.duration_s }}
      skip: ${{ steps.plan.outputs.skip }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install --quiet curl_cffi==0.14.0 pillow==12.2.0
      - name: Resolve meta + download chat + collect emotes
        id: plan
        run: |
          PYTHONPATH=scripts python scripts/plan.py \
            "${{ inputs.slug }}" "${{ inputs.uuid }}" \
            --out out --limit-windows "${{ inputs.limit_windows }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: chatpack
          path: out/
          retention-days: 3

  burn:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: true
      max-parallel: 2
      matrix:
        seg: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install --quiet curl_cffi==0.14.0 "yt-dlp[default,curl-cffi]==2026.7.4" pillow==12.2.0 fonttools==4.60.1
      - name: Install ffmpeg (ubuntu-24.04ランナーは未搭載)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Fetch fonts (pinned, verified)
        run: |
          mkdir -p fonts
          curl -fsSL -o fonts/BIZUDPGothic-Regular.ttf "$FONT_URL"
          got=$(git hash-object fonts/BIZUDPGothic-Regular.ttf)
          if [ "$got" != "$FONT_BLOB_SHA" ]; then
            echo "font hash mismatch: $got"; exit 1
          fi
          curl -fsSL -o fonts/NotoColorEmoji.ttf "$EMOJI_FONT_URL"
          got=$(git hash-object fonts/NotoColorEmoji.ttf)
          if [ "$got" != "$EMOJI_FONT_BLOB_SHA" ]; then
            echo "emoji font hash mismatch: $got"; exit 1
          fi
      - name: Free disk space (8時間級VODのDL+エンコードに備える)(1080p対応で拡大)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost /usr/lib/jvm \
            /usr/local/lib/node_modules /usr/local/share/powershell /usr/share/miniconda \
            2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h / | tail -1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: chatpack
          path: out
      - name: Download VOD + burn segment
        run: |
          seg_name=$(printf 'seg_%03d.mp4' "${{ matrix.seg.idx }}")
          PYTHONPATH=scripts python scripts/burn.py \
            "${{ inputs.slug }}" "${{ inputs.uuid }}" \
            "${{ matrix.seg.start }}" "${{ matrix.seg.end }}" \
            --chat out/chat.jsonl --emotes out/emotes --meta out/meta.json \
            --font fonts/BIZUDPGothic-Regular.ttf --out "$seg_name"
          rm -f vod.mp4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: seg-${{ matrix.seg.idx }}
          path: seg_*.mp4
          retention-days: 1

  assemble:
    needs: [plan, burn]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install --quiet google-auth==2.53.0 google-auth-httplib2==0.3.1 google-api-python-client==2.194.0 curl_cffi==0.14.0 pillow==12.2.0 fonttools==4.60.1
      - name: Install ffmpeg (ubuntu-24.04ランナーは未搭載)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Fetch fonts for thumbnail (pinned, verified)
        run: |
          mkdir -p fonts
          curl -fsSL -o fonts/BIZUDPGothic-Regular.ttf "$FONT_URL"
          got=$(git hash-object fonts/BIZUDPGothic-Regular.ttf)
          if [ "$got" != "$FONT_BLOB_SHA" ]; then
            echo "font hash mismatch: $got"; exit 1
          fi
          curl -fsSL -o fonts/NotoColorEmoji.ttf "$EMOJI_FONT_URL"
          got=$(git hash-object fonts/NotoColorEmoji.ttf)
          if [ "$got" != "$EMOJI_FONT_BLOB_SHA" ]; then
            echo "emoji font hash mismatch: $got"; exit 1
          fi
      - name: Free disk space (セグメント合計+結合後で2倍の容量が要る)(1080p対応で拡大)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost /usr/lib/jvm \
            /usr/local/lib/node_modules /usr/local/share/powershell /usr/share/miniconda \
            2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h / | tail -1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: chatpack
          path: out
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          pattern: seg-*
          path: segs
      - name: Concat + verify
        run: PYTHONPATH=scripts python scripts/assemble.py --meta out/meta.json --segdir segs --out final.mp4
      - name: Generate thumbnail (盛り上がりピークのフレーム+タイトル+配信日)
        run: |
          PYTHONPATH=scripts python scripts/thumbnail.py \
            --meta out/meta.json --chat out/chat.jsonl \
            --font fonts/BIZUDPGothic-Regular.ttf \
            --emoji-font fonts/NotoColorEmoji.ttf \
            --out thumb.jpg --fallback-video final.mp4 || echo "thumbnail generation failed — continue without"
      - name: Upload to YouTube
        id: upload
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          YT_TOKEN_JSON_NINIMARU: ${{ secrets.YT_TOKEN_JSON_NINIMARU }}
          YT_TOKEN_JSON_WAINAINA: ${{ secrets.YT_TOKEN_JSON_WAINAINA }}
        run: |
          PYTHONPATH=scripts python scripts/yt_upload.py final.mp4 \
            --meta out/meta.json --privacy "${{ inputs.privacy }}" --thumb thumb.jpg
      - name: Mark done
        run: |
          PYTHONPATH=scripts python scripts/mark_done.py "${{ inputs.uuid }}" \
            --status done --yt-url "${{ steps.upload.outputs.yt_url }}" \
            --yt-parts '${{ steps.upload.outputs.yt_parts }}'
      - name: Notify (Discord, optional)
        if: always()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TITLE: ${{ needs.plan.outputs.title }}
          YT_URL: ${{ steps.upload.outputs.yt_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VOD: ${{ inputs.slug }}/${{ inputs.uuid }}
          JOB_STATUS: ${{ job.status }}
        run: |
          [ -z "$WEBHOOK" ] && exit 0
          if [ "$JOB_STATUS" = "success" ]; then
            export MSG="kick-archive OK: $TITLE -> $YT_URL"
          else
            export MSG="kick-archive FAILED: $VOD ($RUN_URL)"
          fi
          curl -fsS -H "Content-Type: application/json" \
            -d "$(python -c 'import json,os;print(json.dumps({"content":os.environ["MSG"]}))')" \
            "$WEBHOOK" || true
