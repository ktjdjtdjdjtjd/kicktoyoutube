name: chapters
# 投稿済み動画のタイムスタンプ自動生成 (3時間おきに未処理の1本を処理)
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      uuid:
        description: "特定動画のuuid (空=未処理の最古)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: chapters
  cancel-in-progress: false

jobs:
  chapters:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: |
          pip install --quiet curl_cffi==0.14.0 "yt-dlp[default,curl-cffi]==2026.7.4" \
            faster-whisper==1.2.1 \
            google-auth==2.53.0 google-auth-httplib2==0.3.1 google-api-python-client==2.194.0
      - name: Install ffmpeg (ubuntu-24.04ランナーは未搭載)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Generate chapters
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: |
          PYTHONPATH=scripts python scripts/chapters.py --uuid "${{ inputs.uuid }}"
