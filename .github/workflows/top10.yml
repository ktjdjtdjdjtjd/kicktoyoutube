name: top10
# 盛り上がりTop10（最大約5分×10本）を切り出し、コメントを焼き込み、GitHub Releasesへ保存する。
# 仕様: bridgeclip docs/REQUIREMENTS_top10.md
on:
  workflow_dispatch:
    inputs:
      video:
        description: "Kick VOD URL (kick.com/zingisukan2525/videos/<uuid>)"
        required: true

permissions:
  contents: read

concurrency:
  group: top10-${{ inputs.video }}
  cancel-in-progress: false

env:
  # 切り抜き動画は他人の配信なので、公開リポジトリには置かない。
  # 処理(分)はこの公開リポジトリで回し(無料)、MP4は非公開リポジトリのReleaseへ直接アップロードする。
  # 公開リポジトリのartifactは誰でも取得できるため、MP4をartifactにしない。
  CLIPS_REPO: "ktjdjtdjdjtjd/zingisukan-top10-clips"
  FONT_URL: "https://raw.githubusercontent.com/google/fonts/7da950f21232dc96d330070ae4cd5b98f02026d3/ofl/bizudpgothic/BIZUDPGothic-Regular.ttf"
  FONT_BLOB_SHA: "0753da0963c2fa25c5b5990d13f51842cb34e50d"

jobs:
  guard:
    # TOP10_RELEASE_TOKEN が無ければ何もせず正常終了（動画DL・焼き込み・アップロードは一切しない）
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ok: ${{ steps.g.outputs.ok }}
    steps:
      - id: g
        env:
          T: ${{ secrets.TOP10_RELEASE_TOKEN }}
        run: |
          if [ -z "$T" ]; then echo "::notice::TOP10_RELEASE_TOKEN not set; skipping top10 run"; echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
  plan:
    needs: guard
    if: needs.guard.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      slug: ${{ steps.plan.outputs.slug }}
      uuid: ${{ steps.plan.outputs.uuid }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install --quiet curl_cffi==0.14.0 "yt-dlp[default,curl-cffi]==2026.7.4" pillow==12.2.0
      - name: Resolve VOD + download chat
        id: plan
        run: PYTHONPATH=scripts python scripts/burn_request.py --platform kick --video "${{ inputs.video }}" --limit-seconds 0
      - name: Score + pick top10 (viewers/raids optional)
        id: pick
        run: |
          dur=$(python -c "import json;print(json.load(open('out/meta.json'))['duration_s'])")
          uuid="${{ steps.plan.outputs.uuid }}"
          extra=""
          # 配信中に viewer_poll.yml が記録した live-<id>.json を開始時刻(±10分)で対応付ける
          python scripts/viewer_poll.py --link-meta out/meta.json --dir state/viewers --link-out out/viewers.json || true
          [ -f out/viewers.json ] && extra="$extra --viewers out/viewers.json"
          python scripts/top10.py --chat out/chat.jsonl --duration "$dur" $extra --out out/top10.json --matrix-out out/matrix.json
          echo "matrix=$(cat out/matrix.json)" >> "$GITHUB_OUTPUT"
      - name: Create private draft release (stop if it already exists)
        env:
          GH_TOKEN: ${{ secrets.TOP10_RELEASE_TOKEN }}
        run: |
          tag="top10-${{ steps.plan.outputs.uuid }}"
          if gh release view "$tag" --repo "$CLIPS_REPO" >/dev/null 2>&1; then echo "release $tag already exists; stop"; exit 1; fi
          gh release create "$tag" --repo "$CLIPS_REPO" --draft --title "Top10 ${{ steps.plan.outputs.uuid }}" --notes "BridgeClip top10 clips (auto)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: chatpack   # チャットとメタのみ（動画は含めない）
          path: out/
          retention-days: 2

  burn:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: true
      max-parallel: 5
      matrix:
        seg: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install --quiet curl_cffi==0.14.0 "yt-dlp[default,curl-cffi]==2026.7.4" pillow==12.2.0 fonttools==4.60.1
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Fetch font (pinned, verified)
        run: |
          mkdir -p fonts
          curl -fsSL -o fonts/BIZUDPGothic-Regular.ttf "$FONT_URL"
          [ "$(git hash-object fonts/BIZUDPGothic-Regular.ttf)" = "$FONT_BLOB_SHA" ] || { echo "font hash mismatch"; exit 1; }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: chatpack
          path: out
      - name: Burn clip
        run: |
          name=$(printf 'clip_%02d.mp4' "${{ matrix.seg.idx }}")
          PYTHONPATH=scripts python scripts/burn.py \
            "${{ needs.plan.outputs.slug }}" "${{ needs.plan.outputs.uuid }}" \
            "${{ matrix.seg.start }}" "${{ matrix.seg.end }}" \
            --chat out/chat.jsonl --emotes out/emotes --meta out/meta.json \
            --font fonts/BIZUDPGothic-Regular.ttf --out "$name"
          rm -f vod.mp4
      - name: Upload clip to private draft release
        env:
          GH_TOKEN: ${{ secrets.TOP10_RELEASE_TOKEN }}   # fine-grained PAT: CLIPS_REPO のみ / Contents: Read and write
        run: |
          name=$(printf 'clip_%02d.mp4' "${{ matrix.seg.idx }}")
          gh release upload "top10-${{ needs.plan.outputs.uuid }}" "$name" --repo "$CLIPS_REPO"
          rm -f "$name"

  release:
    needs: [plan, burn]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: chatpack
          path: out
      - name: Build index.json from uploaded clips, then publish (still private repo)
        env:
          GH_TOKEN: ${{ secrets.TOP10_RELEASE_TOKEN }}
        run: |
          tag="top10-${{ needs.plan.outputs.uuid }}"
          mkdir -p clips
          gh release download "$tag" --repo "$CLIPS_REPO" --pattern 'clip_*.mp4' --dir clips
          python scripts/top10_index.py --top10 out/top10.json --meta out/meta.json --clips clips --uuid "${{ needs.plan.outputs.uuid }}" --run-id "${{ github.run_id }}" --chat out/chat.jsonl --out clips/index.json
          gh release upload "$tag" --repo "$CLIPS_REPO" clips/clip_*-comments.json clips/clip_*-candidates.json clips/index.json
          gh release edit "$tag" --repo "$CLIPS_REPO" --draft=false --latest=false
