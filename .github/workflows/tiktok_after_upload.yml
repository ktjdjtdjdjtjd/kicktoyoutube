name: tiktok_after_upload

# workflow_run configuration is read from the default branch. This dispatcher
# checks out that branch and accepts upstream runs only from the same branch.
on:
  workflow_run:
    workflows: [process]
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: tiktok-after-upload-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      ((vars.TIKTOK_TEST_POST_ENABLED == 'true' && vars.TIKTOK_AUTOPUBLISH_ENABLED != 'true') ||
       (vars.TIKTOK_TEST_POST_ENABLED != 'true' && vars.TIKTOK_AUTOPUBLISH_ENABLED == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Download upstream chatpack artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: chatpack
          path: out
          run-id: ${{ github.event.workflow_run.id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
      - name: Validate published source and dispatch shorts_prep
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_BRANCH: ${{ github.event.workflow_run.head_branch }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
          TIKTOK_TEST_POST_ENABLED: ${{ vars.TIKTOK_TEST_POST_ENABLED }}
          TIKTOK_AUTOPUBLISH_ENABLED: ${{ vars.TIKTOK_AUTOPUBLISH_ENABLED }}
        run: python scripts/shorts_after_upload_dispatch.py --meta out/meta.json --state-dir state
