name: board_replay
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Completed process run containing a Jingisukan chatpack"
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: board-replay
  cancel-in-progress: false
jobs:
  append:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify source run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          python - <<'PY'
          import os, subprocess, json
          run_id=os.environ['RUN_ID']
          assert run_id.isdigit()
          d=json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+run_id]))
          assert d['head_branch']=='main' and d['event']=='workflow_dispatch' and d['path']=='.github/workflows/process.yml'
          PY
      - run: pip install --quiet curl_cffi==0.14.0 pillow==12.2.0
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: chatpack
          path: out
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Append candidates using downloaded chat
        env:
          BOARD_URL: ${{ vars.BOARD_URL }}
          BOARD_INGEST_TOKEN: ${{ secrets.BOARD_INGEST_TOKEN }}
        run: PYTHONPATH=scripts python scripts/board_from_chatpack.py
